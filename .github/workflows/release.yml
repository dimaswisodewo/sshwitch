name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: x86_64
          - runner: macos-14
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Build release binary
        run: swift build -c release --arch ${{ matrix.arch }}

      - name: Create archive
        run: tar czf sshwitch-${{ matrix.arch }}.tar.gz -C .build/release sshwitch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshwitch-${{ matrix.arch }}
          path: sshwitch-${{ matrix.arch }}.tar.gz

  release:
    name: Create Release & Update Tap
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute sha256 hashes
        run: |
          echo "SHA_ARM64=$(shasum -a 256 sshwitch-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SHA_X86_64=$(shasum -a 256 sshwitch-x86_64.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            sshwitch-arm64.tar.gz \
            sshwitch-x86_64.tar.gz \
            --title "sshwitch ${{ github.ref_name }}" \
            --generate-notes

      - name: Update formula in tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/dimaswisodewo/homebrew-tools.git tap
          sed -i \
            -e "s|version \".*\"|version \"${{ env.VERSION }}\"|" \
            -e "s|/download/v[^/]*/sshwitch-arm64|/download/${{ github.ref_name }}/sshwitch-arm64|" \
            -e "s|/download/v[^/]*/sshwitch-x86_64|/download/${{ github.ref_name }}/sshwitch-x86_64|" \
            -e "/sshwitch-arm64\.tar\.gz\"/{n; s|sha256 \".*\"|sha256 \"${{ env.SHA_ARM64 }}\"|;}" \
            -e "/sshwitch-x86_64\.tar\.gz\"/{n; s|sha256 \".*\"|sha256 \"${{ env.SHA_X86_64 }}\"|;}" \
            tap/Formula/sshwitch.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sshwitch.rb
          git commit -m "sshwitch ${{ github.ref_name }}"
          git push
